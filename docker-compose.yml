services:
  hubspot-api:
    build:
      context: ./server/hubspot
      dockerfile: Dockerfile
    container_name: simulador-hubspot-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "3000"
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      HUBSPOT_BASE_URL: ${HUBSPOT_BASE_URL:-https://api.hubapi.com}
    ports:
      # Host :3000 para npm run dev (Vite proxea /api/hubspot-contact aquí).
      # El SPA en Docker sigue usando http://hubspot-api:3000 por red interna.
      - "3000:3000"
    networks:
      - traefik_default

  simulador-becas:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: simulador-becas
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - hubspot-api
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.simulador-becas.rule=Host(`simulador-dev.uniacc.cl`)"
      - "traefik.http.routers.simulador-becas.entrypoints=web"
      - "traefik.http.routers.simulador-becas.priority=200"
      - "traefik.http.services.simulador-becas.loadbalancer.server.port=80"
    networks:
      - traefik_default

networks:
  traefik_default:
    external: true
